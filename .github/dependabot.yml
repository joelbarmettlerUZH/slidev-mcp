version: 2
updates:
  - package-ecosystem: docker
    directory: /builder
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native rewrite and drops the JS API that vue-tsc loads, so the
      # dashboard typecheck fails with ERR_PACKAGE_PATH_NOT_EXPORTED. Revisit when vue-tsc supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
